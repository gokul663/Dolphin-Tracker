# Local DynamoDB for development. Start with `make ddb-up` (docker or podman), then `make ddb-table`.
# Images are registry-qualified so Podman resolves them without extra configuration.
services:
  dynamodb:
    image: docker.io/amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/data
  dynamodb-admin:
    image: docker.io/aaronshaf/dynamodb-admin:latest
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "8001:8001"
    depends_on:
      - dynamodb
volumes:
  dynamodb-data:
